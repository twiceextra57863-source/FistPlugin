# FistPlugin Messages

prefix: "&8[&6Fist&8] &r"

commands:
  help:
    - "&8&m+----------------------------+"
    - "&6&lFistPlugin Commands"
    - "&8&m+----------------------------+"
    - "&e/fist help &7- Show this help"
    - "&e/fist menu &7- Open fist selector"
    - "&e/fist info [player] &7- Show fist info"
    - "&e/fist stats [player] &7- Show player stats"
    - "&e/fist list &7- List all fists"
    - "&8&m+----------------------------+"
  
  admin-help:
    - "&8&m+----------------------------+"
    - "&c&lFistPlugin Admin Commands"
    - "&8&m+----------------------------+"
    - "&c/fistadmin give <player> <fist> &7- Give fist to player"
    - "&c/fistadmin remove <player> &7- Remove player's fist"
    - "&c/fistadmin reload &7- Reload plugin"
    - "&c/fistadmin clearall &7- Clear all fists"
    - "&c/fistadmin reset <player> &7- Reset player stats"
    - "&8&m+----------------------------+"

